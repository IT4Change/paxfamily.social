creation_rules:
  # Kubernetes Secrets that Flux applies to the staging cluster: also encrypted to that cluster's own
  # key (IT4Change/flux, environments/default), so its kustomize-controller can decrypt them. Only
  # data/stringData are encrypted; kind and metadata stay readable, as kustomize builds the manifests
  # before Flux decrypts them.
  - path_regex: flux/staging/.*\.sops\.yaml$
    encrypted_regex: ^(data|stringData)$

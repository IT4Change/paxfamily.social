# Structure of environments/default.secrets.yaml and environments/production.secrets.yaml — the
# same keys the other configurations carry. Copy it to both names, fill it in and encrypt it with
# `sops encrypt -i <file>` (recipients: ../../.sops.yaml) BEFORE the first commit of the real file.
# Never commit a filled-in copy unencrypted.
deploy:
    ACME_EMAIL: ""
jwt:
    JWT_SECRET: ""
s3:
    AWS_ACCESS_KEY_ID: ""
    AWS_SECRET_ACCESS_KEY: ""
    AWS_ENDPOINT: ""
    AWS_REGION: ""
    AWS_BUCKET: ""
email:
    # Sender of the network's e-mails. Its domain needs SPF + DKIM (SMTP_DKIM_* below), or they land
    # in spam.
    EMAIL_DEFAULT_SENDER: "noreply@paxfamily.social"
    SMTP_HOST: ""
    SMTP_USERNAME: ""
    SMTP_PASSWORD: ""
    SMTP_PORT: ""
    SMTP_IGNORE_TLS: ""
    SMTP_SECURE: ""
    SMTP_DKIM_PRIVATEKEY: ""
    SMTP_DKIM_DOMAINNAME: "paxfamily.social"
    SMTP_DKIM_KEYSELECTOR: ""
    SMTP_MAX_CONNECTIONS: ""
redis:
    REDIS_PASSWORD: null
imagor:
    IMAGOR_SECRET: ""
neo4j:
    NEO4J_USERNAME: null
    NEO4J_PASSWORD: null
map:
    MAPBOX_TOKEN: ""
livekit:
    LIVEKIT_URL: ""
    LIVEKIT_API_KEY: ""
    LIVEKIT_API_SECRET: ""

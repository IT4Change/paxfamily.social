name: publish

on:
  push:
  # Rebuilds the images on the newest ocelot.social images of $OCELOT_VERSION without a commit here —
  # what a branch or `master` in .env needs, as their tags move.
  workflow_dispatch:

jobs:
  build-and-push-images:
    strategy:
      matrix:
        app:
          - name: backend
            file: docker/backend.Dockerfile
          - name: webapp
            file: docker/webapp.Dockerfile
          - name: maintenance
            file: docker/maintenance.Dockerfile
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}/${{ matrix.app.name }}
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.1.7
      - name: Log in to the Container registry
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Read $OCELOT_VERSION from file
        run: cat .env >> $GITHUB_ENV
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@70b2cdc6480c1a8b86edf1777157f8f437de2166
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=schedule
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=ref,event=branch
            type=ref,event=pr
            type=sha
          labels: |
            ocelot-version=${{ env.OCELOT_VERSION }}
      - name: Build and push Docker images
        id: push
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75
        with:
          file:  ${{ matrix.app.file }}
          context: ${{ matrix.app.context || '.' }}
          push: true
          build-args: |
              OCELOT_VERSION=${{ env.OCELOT_VERSION }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}


# No deploy from here. The cluster's credentials do not belong on GitHub, not even sops-encrypted:
# the deploy is meant to be triggered by a webhook to a receiving service that does not exist yet.
# Until then deploy by hand with helmfile (see README).

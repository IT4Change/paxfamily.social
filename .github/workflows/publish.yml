name: publish

on:
  push:
    # flux/ and helmfile/ are deployment configuration, not image input. flux/ is also where Flux
    # commits the tag it rolls out (flux/staging/images.yaml): building on those commits would make
    # every rollout trigger the next build.
    paths-ignore:
      - 'flux/**'
      - 'helmfile/**'
  # Rebuilds the images on the newest ocelot.social images of $OCELOT_VERSION without a commit here —
  # what a branch or `master` in .env needs, as their tags move.
  workflow_dispatch:

jobs:
  build-and-push-images:
    strategy:
      matrix:
        app:
          - name: backend
            file: docker/backend.Dockerfile
          - name: webapp
            file: docker/webapp.Dockerfile
          - name: maintenance
            file: docker/maintenance.Dockerfile
          # The build stage of the backend: what the reseed job runs (flux/staging/seed.yaml), as
          # the seed needs tsx and faker, which the runtime image does not ship.
          - name: backend-seed
            file: docker/backend.Dockerfile
            target: build
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}/${{ matrix.app.name }}
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4.1.7
      - name: Log in to the Container registry
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Read $OCELOT_VERSION from file
        run: cat .env >> "$GITHUB_ENV"
      # `<branch>-<run number>-<sha7>`, the tag Flux picks the newest build by (flux/staging/images.yaml).
      # The run number, not the commit time: a manual rebuild of the same commit on newer
      # ocelot.social images has to win over the build before it, and it is the same for every image
      # of one run.
      - name: Short commit sha
        id: short
        run: echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@70b2cdc6480c1a8b86edf1777157f8f437de2166
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=schedule
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=ref,event=branch
            type=ref,event=pr
            type=sha
            type=raw,value=${{ github.ref_name }}-${{ github.run_number }}-${{ steps.short.outputs.sha }},enable=${{ github.ref_type == 'branch' && !contains(github.ref_name, '/') }}
          labels: |
            ocelot-version=${{ env.OCELOT_VERSION }}
      - name: Build and push Docker images
        id: push
        uses: docker/build-push-action@4f58ea79222b3b9dc2c8bbdd6debcef730109a75
        with:
          file:  ${{ matrix.app.file }}
          target: ${{ matrix.app.target }}
          context: .
          push: true
          build-args: |
              OCELOT_VERSION=${{ env.OCELOT_VERSION }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}


  # "Check now" to Flux on the staging cluster (flux/staging/receiver.yaml). Only a hint: Flux finds
  # a new build within minutes anyway, and its ImagePolicy decides what runs. Skipped while the
  # secrets are not set.
  notify-flux:
    runs-on: ubuntu-latest
    needs: build-and-push-images
    if: ${{ github.ref == 'refs/heads/master' }}
    permissions: {}
    env:
      FLUX_WEBHOOK_URL: ${{ secrets.FLUX_WEBHOOK_URL }}
      FLUX_WEBHOOK_TOKEN: ${{ secrets.FLUX_WEBHOOK_TOKEN }}
    steps:
      - name: Notify Flux
        run: |
          if [ -z "$FLUX_WEBHOOK_URL" ] || [ -z "$FLUX_WEBHOOK_TOKEN" ]; then
            echo "FLUX_WEBHOOK_URL / FLUX_WEBHOOK_TOKEN not set, Flux finds the build by polling"
            exit 0
          fi
          body="{\"ref\":\"${GITHUB_REF}\",\"sha\":\"${GITHUB_SHA}\"}"
          signature=$(printf '%s' "$body" | openssl dgst -sha256 -hmac "$FLUX_WEBHOOK_TOKEN" -r | cut -d' ' -f1)
          curl --fail-with-body --silent --show-error --max-time 30 \
            -H "Content-Type: application/json" \
            -H "X-Signature: sha256=${signature}" \
            -d "$body" "$FLUX_WEBHOOK_URL"

# No deploy from here. The cluster's credentials do not belong on GitHub, not even sops-encrypted:
# Flux on the cluster pulls (flux/staging/). Production is still deployed by hand with helmfile.

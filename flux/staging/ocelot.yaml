apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: paxfamily-social-ocelot
  namespace: flux-system
spec:
  interval: 10m
  # The release helmfile created, taken over in place.
  releaseName: paxfamily-social-ocelot
  targetNamespace: paxfamily-social-staging
  storageNamespace: paxfamily-social-staging
  install:
    createNamespace: true
  dependsOn:
    - name: paxfamily-social-neo4j
  chart:
    spec:
      chart: ./deployment/helm/charts/ocelot-social
      sourceRef:
        kind: GitRepository
        name: ocelot-social
      reconcileStrategy: Revision
  # secrets.* of the chart (JWT, S3, SMTP, imagor, Mapbox, LiveKit, ACME e-mail).
  valuesFrom:
    - kind: Secret
      name: paxfamily-social-values
      valuesKey: values.yaml
  values:
    domain: paxfamily.social.stage.ocelot-social.it4c.org
    redirect_domains: []
    cert_manager:
      issuer: paxfamily-social-ocelot-letsencrypt-prod
    underMaintenance: false
    global:
      image:
        # The newest image build of this repo's master, written by publish.yml (roll-out-staging).
        tag: master-5-b56bcdf # image tag: written by publish.yml
        pullPolicy: Always
    backend:
      image:
        repository: ghcr.io/it4change/paxfamily.social/backend
      env:
        NEO4J_URI: bolt://ocelot-neo4j-neo4j:7687
        # Staging may be wiped and reseeded (seed.yaml, reseed.yaml, scripts/reseed.sh). The jobs read
        # it from the backend's config map, never set it themselves.
        DB_WIPE_ALLOWED: "true"
        PUBLIC_REGISTRATION: "false"
        INVITE_REGISTRATION: "true"
        CATEGORIES_ACTIVE: "false"
        MAX_PINNED_POSTS: "1"
        MAX_GROUP_PINNED_POSTS: "3"
        BADGES_ENABLED: "false"
        API_KEYS_ENABLED: "true"
        API_KEYS_MAX_PER_USER: "5"
        ASK_FOR_REAL_NAME: "false"
        REQUIRE_LOCATION: "false"
        SHOW_CONTENT_FILTER_HEADER_MENU: "false"
        SHOW_CONTENT_FILTER_MASONRY_GRID: "true"
        SHOW_GROUP_BUTTON_IN_HEADER: "true"
        # Contact identity: e-mail/link config, not brand design, so ENV rather than branding.
        SUPPORT_EMAIL: info@pax.family
        SUPPORT_LINK: https://pax.family/kontakt
        ORGANIZATION_LINK: https://pax.family
        # One of brandings/<name>/ by brand id; the images hold all of them.
        OCELOT_ACTIVE_BRANDING: paxfamily
    webapp:
      image:
        repository: ghcr.io/it4change/paxfamily.social/webapp
      env:
        NETWORK_NAME: PAX Family
        OCELOT_ACTIVE_BRANDING: paxfamily
    maintenance:
      image:
        repository: ghcr.io/it4change/paxfamily.social/maintenance
      env:
        SUPPORT_EMAIL: info@pax.family
    neo4j:
      image:
        repository: ghcr.io/ocelot-social-community/ocelot-social/neo4j
        tag: master
      storage: 5Gi
      storageBackups: 10Gi
      resources:
        requests:
          memory: 2Gi
        limits:
          memory: 4Gi

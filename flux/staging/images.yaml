# Which image build runs on staging, decided here in the cluster: the newest build of this repo's
# master. publish.yml tags every build `<branch>-<run number>-<sha7>`; the run number only grows,
# so the highest one is the newest build — also when a manual run rebuilds the same commit on newer
# ocelot.social images. backend, webapp and maintenance carry the same tag, so the backend's decides
# for all three (chart value global.image.tag). The seed image needs its own policy only because
# its whole reference is one string in the Job, and a marker sets either a tag field or a whole
# reference; the rule is the same.
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: paxfamily-social-backend
  namespace: flux-system
spec:
  image: ghcr.io/it4change/paxfamily.social/backend
  interval: 5m
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageRepository
metadata:
  name: paxfamily-social-backend-seed
  namespace: flux-system
spec:
  image: ghcr.io/it4change/paxfamily.social/backend-seed
  interval: 5m
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: paxfamily-social-staging
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: paxfamily-social-backend
  filterTags:
    pattern: '^master-(?P<run>[0-9]+)-[0-9a-f]{7}$'
    extract: '$run'
  policy:
    numerical:
      order: asc
---
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImagePolicy
metadata:
  name: paxfamily-social-staging-seed
  namespace: flux-system
spec:
  imageRepositoryRef:
    name: paxfamily-social-backend-seed
  filterTags:
    pattern: '^master-(?P<run>[0-9]+)-[0-9a-f]{7}$'
    extract: '$run'
  policy:
    numerical:
      order: asc
---
# Writes the chosen tag into the manifests of this directory (the `$imagepolicy` markers) and
# commits it to master, which rolls it out. publish.yml ignores flux/, so these commits build
# nothing. Pushes with the deploy key in IT4Change/flux (clusters/staging).
apiVersion: image.toolkit.fluxcd.io/v1
kind: ImageUpdateAutomation
metadata:
  name: paxfamily-social-staging
  namespace: flux-system
spec:
  interval: 5m
  sourceRef:
    kind: GitRepository
    name: paxfamily-social
  git:
    checkout:
      ref:
        branch: master
    commit:
      author:
        name: fluxcdbot
        email: fluxcdbot@users.noreply.github.com
      messageTemplate: |
        chore(staging): roll out {{ range .Changed.Changes }}{{ .NewValue }}{{ break }}{{ end }}
    push:
      branch: master
  update:
    path: ./flux/staging
    strategy: Setters
